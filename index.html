<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Calculator app</title>
  <script type="module" src="./js/main.js"></script>

</head>

<body>

  <div class="container">

    <header class="header">

      <h1 class="header__title">calc</h1>

      <fieldset class="theme">

        <legend class="theme__label">theme</legend>

        <div class="theme__container">

          <div class="theme__numbers">
            <label class="theme__number" for="theme-light">1</label>
            <label class="theme__number" for="theme-dark">2</label>
            <label class="theme__number" for="theme-purple">3</label>
          </div>

          <div class="theme__buttons">
            <input class="theme__button" type="radio" id="theme-light" name="theme" value="light" checked>
            <input class="theme__button" type="radio" id="theme-dark" name="theme" value="dark">
            <input class="theme__button" type="radio" id="theme-purple" name="theme" value="purple">
          </div>

        </div>

      </fieldset>

    </header>

    <main class="calc">

      <div class="calc__screen">

        <output class="calc__output">399.981</output>

      </div>

      <div class="calc__keys">

        <template id="key-template">
          <button class="calc__key"></button>
        </template>

      </div>
    </main>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Chapelle maxime</a>.
  </footer>

</body>

</html>
